name: Sync upstream

# Daily merge of upstream main into this fork's main, keeping local patches
# on top. Fails loudly on merge conflict — resolve locally:
#   git fetch upstream && git merge upstream/main   # fix, commit, push
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/niri-wm/niri.git
          git fetch upstream main --tags
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
          elif ! git merge --no-edit upstream/main; then
            echo "::error::Merge conflict with upstream — resolve locally and push."
            exit 1
          fi
          git push origin main --tags
